spring.datasource.url=jdbc:h2:mem:topteacher-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/base-data.sql
tt.database.initialization.prompt-on-first-start=true

tt.mcp.enabled=false
tt.mcp.token-file=
spring.ai.mcp.server.enabled=${tt.mcp.enabled}
spring.ai.mcp.server.name=topteacher
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=${tt.mcp.enabled}
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head><meta charset="UTF-8"/><title th:text="${model.title}">Aufgabenblatt</title>
<link rel="stylesheet" href="exam-task-sheet.css"/></head>
<body>
<div class="page-footer">Seite <span class="page-number"></span> / <span class="page-count"></span></div>
<header>
    <table class="opening-line">
        <colgroup><col class="course-date-column"/><col class="name-gap"/><col class="name-label-column"/><col/></colgroup>
        <tr>
            <td th:text="${model.course + ' · ' + model.date}"></td><td></td>
            <td class="name-label">Name:</td>
            <td class="name-line"><span class="pupil-name" th:style="${model.nameStyle()}" th:text="${model.pupilName}"></span></td>
        </tr>
    </table>
    <h1 th:text="${model.title}"></h1>
    <table class="metadata"><tr><td class="points" th:text="${'Gesamt: ' + model.points + ' Punkte'}"></td></tr></table>
</header>
<section class="part" th:each="part, state : ${model.parts}" th:classappend="${state.first ? 'first-part' : ''}">
    <h2 class="part-heading budget-heading"><span class="heading-title" th:text="${part.title}"></span><span class="heading-points" th:text="${part.points + ' Punkte'}"></span></h2>
    <section class="material" th:each="material : ${part.materials}" th:classappend="${material.newPage ? 'new-page' : ''}">
        <h3 th:if="${material.showTitle}" th:text="${material.title}"></h3><div th:utext="${material.html}"></div>
    </section>
    <section class="tasks" th:classappend="${part.tasksOnNewPage ? 'new-page' : ''}">
        <h2 class="part-heading budget-heading" th:if="${part.tasksOnNewPage}"><span class="heading-title" th:text="${part.title}"></span><span class="heading-points" th:text="${part.points + ' Punkte'}"></span></h2>
        <h3>Aufgaben</h3>
        <section class="category" th:each="category : ${part.categories}">
            <h4 class="budget-heading"><span class="heading-title" th:text="${category.title}"></span><span class="heading-points" th:text="${category.points + ' Punkte'}"></span></h4>
            <div th:if="${category.printTasks}">
                <div th:utext="${category.html}"></div>
                <section class="task" th:each="task : ${category.tasks}">
                    <h5 th:text="${task.title}"></h5>
                    <div th:utext="${task.html}"></div>
                    <p class="points task-points" th:text="${task.points + ' Punkte'}"></p>
                </section>
            </div>
        </section>
    </section>
</section>
<div class="closing" th:if="${!#strings.isEmpty(model.footerHtml)}" th:utext="${model.footerHtml}"></div>
</body></html>
